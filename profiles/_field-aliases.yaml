# Where a computation's parameter name and a registry's field name are the same
# quantity under different names or units.
#
# **Verified on every build, never trusted.** An alias whose registry or field
# has disappeared becomes an `alias_field_missing` finding rather than a silent
# failure to resolve — the same discipline as a hand-maintained `implemented_in`
# table, which is the thing that goes stale first.
#
# Add an entry only when no string comparison could honestly bridge the two. A
# leaf with no alias and no name match is reported as `unresolved` with search
# candidates, which is a weaker answer and an honest one.

# **`repo` is declared, not assumed.** Verifying an alias against a repository
# that was never supposed to carry it asks the wrong question and answers it at
# error severity: `radius_m -> data/particles.yaml` is a fact about the
# microscope, and BD has no `data/` at all, so a build that indexed both
# reported the alias as broken. An alias with no `repo` is a finding rather
# than a default, because a default is what made the first version wrong.

aliases:
  radius_m:
    repo: ms
    registry: data/particles.yaml
    field: diameter_um
    note: "data/particles.yaml > diameter_um -- divide by 2 and convert um -> m.
      A radius is not a diameter and the units differ, so no name match should
      be allowed to claim these are the same field."

# Removed: `viscosity_pa_s -> stock_medium`. That alias resolved a value to a
# *pointer* -- `stock_medium` names the medium, and the viscosity is not
# registered anywhere -- and marking it resolved reported `ok` for an input
# nothing supplies. An alias has to reach the quantity, not its neighbourhood.
