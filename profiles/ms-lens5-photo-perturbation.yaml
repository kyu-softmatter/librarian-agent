# Committee Lens 5 -- photo-perturbation.
#
# Owns light level, illumination duty, total dose and wavelength choice.
# Gates and fields below are read off the repository, not invented:
#   photo/checks.py docstrings  -> G20 G21 G22
#   setup.<field> in photo/*.py -> the fields those gates actually consume
#
# G10 (photobleaching) was here and is gone: MS removed it on 2026-09-09,
# having never had it return anything. It stayed in the boost list below until
# 2026-09-15, boosting a gate no code declares -- and nothing caught it, because
# drift reads `docs/` against code and never read this file.
# `tests/test_profiles.py` now does. Lens 5 names no gate at all in its own
# `.claude/agents/` description as a result, which is why the profile-candidate
# design keys on `owns` rather than on gates (PLAN.md 5.3).
#
# Paired with ms-lens4-sample-optics.yaml on purpose. One profile cannot show
# that a profile does anything -- BUILD.md 4-B's criterion is that the same
# question returns a different top three under each, and these two consume
# different corpora.
id: ms:lens-5-photo-perturbation
lens: 5

# A weight, not a filter. `prefer_kinds` as a hard filter was the first draft
# and it removed the answer: most `registry` entries carry `verified: false`,
# and `data/fluorophores.yaml > AlexaFluor488` is exactly what this lens needs.
kind_weight:
  calibration:      2.0    # measured here; outranks anything published
  literature_form:  1.8    # the tier built to be replaced by a calibration
  registry:         1.6    # the field a gate reads at runtime
  expertise:        1.4
  doc_section:      1.0
  decision:         0.8
  system:           0.7
  agent:            0.5
  # Declared, not defaulted. An unlisted kind scores 1.0
  # (librarian/index.py:604), which would have put a plan and a session log
  # above `decision` and `system` by omission. A plan is a proposal for a run
  # that has not happened and a session log is narrative; neither outranks a
  # decision record here.
  plan:             0.7
  session:          0.5

boost:
  gate: [G20, G21, G22]
  field:
    - bleach_photons
    - lifetime_ns
    - quantum_yield
    - ext_coeff_M1cm1
    - power_at_sample_mw
    - photostability
    - photoresponsive
  # `dose_limit_j_cm` and `resolved_irradiance` were listed here and are removed
  # 2026-09-15, for the same reason as lens 4's two: no indexed document carries
  # either. Both exist only in `photo/setup.py` and `photo/cli.py`.
  #
  # **That is structural, not an oversight.** These lists were read off code --
  # the header above says so -- and the index covers `kb/`, `data/`, `docs/` and
  # `.claude/agents/` and **no Python at all**. A field named only in a module is
  # therefore inert by construction, and `dose_limit_j_cm` was also truncated:
  # MS spells it `dose_limit_j_cm2`. Harmless, since a boost is a substring
  # match, and still not the name MS uses.
  path_prefix:
    - data/fluorophores.yaml
    - data/light_sources.yaml
    - data/filters.yaml
    - kb/literature
    - docs/04-decision-engine.md

# Demoted, never excluded. BD's rule is not to raise an unreproduced value as
# **grounds**; it is still the right pointer, and the tier travels with it so a
# caller cannot mistake one for the other.
demote:
  reproduced:
    "no": 0.7

return_always: [evidence, tier, has_falsifier, conditions, review_after]
