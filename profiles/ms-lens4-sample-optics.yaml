# Committee Lens 4 -- sample geometry & optics.
#
# Owns objective choice, immersion, coverslip, imaging depth and chamber.
#   sample/checks.py docstrings  -> G15 G16 G16b G16c G17 G18 G19
#   setup.<field> in sample/*.py -> the fields those gates actually consume
#
# Its captured priors are the `kb/expertise/` entries on immersion media,
# coverslip thickness and sample-medium refractive index, which is why this
# profile weights `expertise` where lens 5 weights `registry`.
id: ms:lens-4-sample-optics
lens: 4

kind_weight:
  calibration:      2.0
  expertise:        1.9    # this lens's own captured priors live here
  system:           1.5    # the instrument dossier: nosepiece, objectives
  registry:         1.4
  literature_form:  1.2
  doc_section:      1.0
  decision:         0.8
  agent:            0.5
  # Declared, not defaulted. An unlisted kind scores 1.0
  # (librarian/index.py:604), which would have put a plan and a session log
  # above `decision` and `system` by omission. A plan is a proposal for a run
  # that has not happened and a session log is narrative; neither outranks a
  # decision record here.
  plan:             0.7
  session:          0.5

boost:
  gate: [G15, G16, G16b, G16c, G17, G18, G19]
  field:
    - objective
    - imaging_depth_um
    - resolved_coverslip_um
    - n_immersion
    - n_medium
    - working_distance
    - unspaced_mount
  # `design_coverslip_um` and `resolved_slab` were listed here and are removed
  # 2026-09-15. `Profile.score` matches a boosted field as a **substring of a
  # document's title, body and conditions** (librarian/index.py), and those two
  # names are carried by no indexed MS document -- they exist in `sample/*.py`
  # as gate outputs and nowhere a search can reach. A term that can never fire
  # is not wrong, it is inert, and inert reads exactly like considered. Put
  # either back the day MS writes it down; `tests/test_profiles.py` is what
  # says whether it can fire.
  path_prefix:
    - data/objectives.yaml
    - data/pixel_size.yaml
    - kb/expertise
    - kb/systems
    - docs/03-cross-system-transfer.md

demote:
  reproduced:
    "no": 0.7

return_always: [evidence, tier, has_falsifier, conditions, review_after]
