[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librarian"
version = "0.1.0"
description = "Knowledge custody, retrieval and interaction for the microscope, simulation and research agents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "mcp>=2.1,<3"]

# mcp is pinned to 2.x on purpose: the SDK renamed FastMCP to MCPServer at 2.0
# and moved it to mcp.server.mcpserver, which is the name mcp_server/server.py
# imports -- so a 1.x install fails at import rather than at run time.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Stated explicitly, because the repository root holds **data** zones beside the
# code and setuptools cannot guess between them: flat-layout discovery found
# `kb`, `map`, `store`, `export` and `profiles` as candidate packages and
# refused. They are not packages -- they are the canonical store, the derived
# artefacts, the published output and the query profiles, read by path at run
# time. TREE.md draws the same line; this is where the build has to be told.
[tool.setuptools]
packages = ["librarian", "adapters", "mcp_server"]

[project.scripts]
librarian = "librarian.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a repository cloned under cache/"]
